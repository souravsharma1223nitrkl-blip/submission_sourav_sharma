/${robot}/bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true

/${robot}/planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5                 # m: plan to a nearby cell if the goal is blocked
      downsample_costmap: false
      allow_unknown: true            # plan through unexplored space while mapping
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      # Cost of a step = distance * (1 + cost_travel_multiplier * cost / 252).
      # A ramp cell (terrain cost ~79 -> costmap ~200) then costs ~5x a flat cell, so a ramp
      # is used only when it is the only way or saves a lot of distance.
      cost_travel_multiplier: 5.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

/${robot}/controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    odom_topic: /${robot}/odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.5
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: ${max_vel_x}
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: ${max_vel_x}
      min_speed_theta: 0.0
      acc_lim_x: ${acc_lim_x}
      acc_lim_y: 0.0
      acc_lim_theta: ${acc_lim_theta}
      decel_lim_x: -${decel_lim_x}
      decel_lim_y: 0.0
      decel_lim_theta: -${acc_lim_theta}
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

/${robot}/local_costmap/local_costmap:
  ros__parameters:
    use_sim_time: true
    update_frequency: 5.0
    publish_frequency: 2.0
    global_frame: ${robot}/odom
    robot_base_frame: ${robot}/base_footprint
    rolling_window: true
    width: 3
    height: 3
    resolution: 0.05
    robot_radius: ${robot_radius}
    plugins: ["obstacle_layer", "fleet_layer", "inflation_layer"]
    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: true
      observation_sources: scan
      scan:
        topic: /${robot}/scan
        data_type: "LaserScan"
        marking: true
        clearing: true
        inf_is_valid: true             # "no echo" beams clear too (open hall, short LiDAR)
        max_obstacle_height: 2.0
        raytrace_max_range: ${raytrace_range}  # clear a bit further than we mark, so no
        raytrace_min_range: 0.0                # obstacle (e.g. a pedestrian) stays behind
        obstacle_max_range: ${obstacle_range}
        obstacle_min_range: 0.0
    fleet_layer:                       # the other robot + its projected trajectory (fleet_scan.py)
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: true
      observation_sources: fleet
      fleet:
        topic: /${robot}/fleet_prediction
        data_type: "LaserScan"
        marking: true
        clearing: true
        inf_is_valid: true             # empty beams clear where another robot used to be
        max_obstacle_height: 2.0
        raytrace_max_range: 30.0       # the whole warehouse: an old position never stays behind
        obstacle_max_range: 30.0
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      cost_scaling_factor: 3.0
      inflation_radius: ${inflation_radius}
    always_send_full_costmap: true

/${robot}/global_costmap/global_costmap:
  ros__parameters:
    use_sim_time: true
    update_frequency: 1.0
    publish_frequency: 1.0
    global_frame: map
    robot_base_frame: ${robot}/base_footprint
    robot_radius: ${robot_radius}
    resolution: 0.05
    track_unknown_space: true
    # Needed by the terrain layer: keep values between free and lethal (not just 0/254),
    # and combine layers with max() so the terrain layer adds cost without erasing the map.
    trinary_costmap: false
    use_maximum: true
    plugins: ["static_layer", "terrain_layer", "obstacle_layer", "fleet_layer", "inflation_layer"]
    static_layer:                      # the merged map of both robots
      plugin: "nav2_costmap_2d::StaticLayer"
      map_topic: /map
      map_subscribe_transient_local: true
      footprint_clearing_enabled: true # never block the robot's own position
    terrain_layer:                     # slope cost from terrain_cost.py
      plugin: "nav2_costmap_2d::StaticLayer"
      map_topic: /terrain_cost
      map_subscribe_transient_local: true
    obstacle_layer:                    # what this robot sees right now
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: true
      observation_sources: scan
      scan:
        topic: /${robot}/scan
        data_type: "LaserScan"
        marking: true
        clearing: true
        inf_is_valid: true             # "no echo" beams clear too (open hall, short LiDAR)
        max_obstacle_height: 2.0
        raytrace_max_range: ${raytrace_range}  # clear a bit further than we mark, so no
        raytrace_min_range: 0.0                # obstacle (e.g. a pedestrian) stays behind
        obstacle_max_range: ${obstacle_range}
        obstacle_min_range: 0.0
    fleet_layer:                       # the other robots (fleet_scan.py); AMR-2's LiDAR can't see AMR-1
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: true
      observation_sources: fleet
      fleet:
        topic: /${robot}/fleet_scan
        data_type: "LaserScan"
        marking: true
        clearing: true
        inf_is_valid: true             # empty beams clear where another robot used to be
        max_obstacle_height: 2.0
        raytrace_max_range: 30.0       # the whole warehouse: an old position never stays behind
        obstacle_max_range: 30.0
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      cost_scaling_factor: 3.0
      inflation_radius: ${inflation_radius}
    always_send_full_costmap: true

/${robot}/behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: ${robot}/odom
    robot_base_frame: ${robot}/base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

/${robot}/waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

/${robot}/lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 10.0
    node_names: ["controller_server", "planner_server", "behavior_server", "bt_navigator", "waypoint_follower"]
