ramps:                         # height changes linearly from `from` (foot) to `to` (top)
  - name: mezzanine_ramp       # the only way up to Heavy Storage
    from: [2.40, 1.965]
    to: [4.40, 1.965]
    width: 1.20
    heights: [0.0, 0.10]       # 10 cm over 2 m = 5 %
  - name: crossover_up         # 4 cm floor bridge in the west corridor
    from: [-3.60, 4.20]
    to: [-3.60, 5.00]
    width: 2.30
    heights: [0.0, 0.04]
  - name: crossover_down
    from: [-3.60, 6.20]
    to: [-3.60, 5.40]
    width: 2.30
    heights: [0.0, 0.04]

platforms:                     # flat raised areas: [x_min, y_min, x_max, y_max]
  - name: mezzanine            # Heavy Storage platform
    area: [4.40, 1.05, 6.85, 2.88]
    height: 0.10
  - name: crossover_top
    area: [-4.75, 5.00, -2.45, 5.40]
    height: 0.04
