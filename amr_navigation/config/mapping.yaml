/**:
  ros__parameters:
    use_sim_time: true
    grid:                      # 15 m x 22 m around the warehouse
      resolution: 0.05         # m per cell
      origin_x: -7.5
      origin_y: -11.0
      width: 300               # cells (a multiple of tile_size / resolution)
      height: 440

/amr1/selective_map_filter:
  ros__parameters:
    tile_size: 1.0             # m
    base_period: 4.0           # s, refresh period of a tile AMR-1 drove through once
    max_period: 64.0           # s, longest refresh period

/map_fusion:
  ros__parameters:
    robot_clear_radius: 0.30   # m around each robot that is never an obstacle

/terrain_cost:
  ros__parameters:
    flat_grade: 0.02           # up to 2 %: flat floor, no extra cost
    max_grade: 0.10            # above 10 %: not drivable
    min_cost: 70               # cost (0..100) of a slope just above flat_grade
    max_cost: 95               # cost (0..100) of a slope at max_grade
